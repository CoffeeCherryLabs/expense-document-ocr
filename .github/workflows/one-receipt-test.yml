name: One receipt integration test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: expense-drive-sync
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - name: OCR and draft for the selected receipt only
        run: npx --no-install tsx scripts/test-one-receipt.ts
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          KNOWN_CARD_LAST4: ${{ secrets.KNOWN_CARD_LAST4 }}
          KNOWN_CARD_USER_ID: ${{ secrets.KNOWN_CARD_USER_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
          EXPENSE_DATA_SOURCE_ID: ${{ vars.EXPENSE_DATA_SOURCE_ID }}
          EVIDENCE_DATA_SOURCE_ID: ${{ vars.EVIDENCE_DATA_SOURCE_ID }}
          TEST_DRIVE_FILE_ID: ${{ secrets.TEST_DRIVE_FILE_ID }}
          TEST_CARD_CLASSIFICATION: ${{ secrets.TEST_CARD_CLASSIFICATION }}
          TEST_FORCE_OCR: 'true'
          MAX_FILES_PER_RUN: '1'
          DRIVE_ORGANIZE_ENABLED: 'false'

# Recheck after receipt label normalization.
# Require a linked draft and retain bounded private amount diagnostics on failure.
# Recover horizontally aligned values from Vision word geometry.
# Verify cached rerun keeps the single linked draft.
# Diagnose masked card formatting without retaining any card digits.
# Normalize underscores misread from card separators.
