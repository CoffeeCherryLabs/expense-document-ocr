name: Weekly evidence organization and report
on:
  workflow_dispatch:
  schedule:
    - cron: '13 1 * * 1' # Monday 10:13 KST; GitHub scheduling can be delayed.
permissions:
  contents: read
concurrency:
  group: expense-drive-sync
  cancel-in-progress: false
jobs:
  report:
    if: vars.EXPENSE_SYNC_ENABLED == 'true' && vars.WEEKLY_ORGANIZATION_REPORT_PAGE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - run: npx tsx scripts/weekly-organize.ts
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_UPLOAD_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_UPLOAD_FOLDER_ID }}
          EXPENSE_DATA_SOURCE_ID: ${{ vars.EXPENSE_DATA_SOURCE_ID }}
          EVIDENCE_DATA_SOURCE_ID: ${{ vars.EVIDENCE_DATA_SOURCE_ID }}
          WEEKLY_ORGANIZATION_REPORT_PAGE_ID: ${{ vars.WEEKLY_ORGANIZATION_REPORT_PAGE_ID }}
          WEEKLY_DRIVE_APPLY_ENABLED: ${{ vars.WEEKLY_DRIVE_APPLY_ENABLED }}
